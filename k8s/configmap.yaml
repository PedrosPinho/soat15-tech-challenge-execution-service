apiVersion: v1
kind: ConfigMap
metadata:
  name: execution-service-config
  namespace: oficina
data:
  NODE_ENV: "production"
  PORT: "3001"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "*"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  JWT_EXPIRES_IN: "1d"
  AWS_REGION: "us-east-1"
  # Nome da tabela e URLs de fila/tópico NÃO ficam aqui: o CI as publica no ConfigMap
  # `execution-service-messaging` a partir das saídas do Terraform (terraform/outputs.tf).
  MESSAGING_DRIVER: "sqs"
  MESSAGING_ENABLED: "true"
  OUTBOX_RELAY_INTERVAL_MS: "1000"
  # Agente New Relic só por env var (sem newrelic.js); sem NEW_RELIC_LICENSE_KEY fica desabilitado.
  NEW_RELIC_NO_CONFIG_FILE: "true"
  NEW_RELIC_LOG: "stdout"
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
