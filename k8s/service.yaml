# ClusterIP: o tráfego externo entra pelo Ingress (ALB interno compartilhado, ADR-013),
# que aponta direto para os pods (target-type=ip).
apiVersion: v1
kind: Service
metadata:
  name: execution-service
  namespace: oficina
spec:
  type: ClusterIP
  selector:
    app: execution-service
  ports:
    - name: http
      port: 3002
      targetPort: http
      protocol: TCP
