# Template do Secret do Execution Service. NÃO aplique diretamente: documenta as chaves
# esperadas. O CI (.github/workflows/ci-cd.yml) monta o Secret real no deploy, lendo o
# JWT_SECRET do SSM Parameter Store (/soat15-tc/<env>/jwt-secret) — nada fica em texto plano.
#
#   kubectl create secret generic execution-service-secret -n oficina \
#     --from-literal=JWT_SECRET=SEGREDO_REAL
apiVersion: v1
kind: Secret
metadata:
  name: execution-service-secret
  namespace: oficina
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME"
  NEW_RELIC_LICENSE_KEY: ""
  NEW_RELIC_APP_NAME: "execution-service"
