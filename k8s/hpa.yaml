apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: execution-service
  namespace: oficina
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: execution-service
  # Cluster pequeno (Learner Lab): 1–2 réplicas. 2+ réplicas são seguras: o consumo da fila é
  # competitivo, o inbox deduplica e o relay do outbox usa lease condicional.
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
